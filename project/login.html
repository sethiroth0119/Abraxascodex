<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Abraxas Codex · Sign In</title>
  <!-- Favicon — Cryptic Node emblem -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="apple-touch-icon" href="favicon.png?v=2"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+SC:wght@400;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold: #cc2222;
      --gold-bright: #f03030;
      --ink: #e8f0e8;
      --ink-dim: #9ab89a;
      --ink-faint: #4a6050;
      --parchment: #050805;
      --parchment-2: #090e09;
      --vellum: #162016;
      --rule: #1a281a;
      --ember: #e06820;
      --serif: "Cormorant Garamond", serif;
      --display: "Cormorant SC", serif;
      --body: "Inter Tight", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--parchment);
      color: var(--ink);
      font-family: var(--body);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* background image */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 0;
      background: url('abraxas-bg.png') center center / cover no-repeat;
      filter: saturate(.2) hue-rotate(110deg) brightness(.5) blur(2px);
      opacity: .20;
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(160deg, rgba(2,4,2,.90) 0%, rgba(3,6,3,.97) 100%);
      pointer-events: none;
    }

    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* brand */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-mark {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #3a1010, #050c05);
      border: 1.5px solid var(--gold);
      box-shadow: 0 0 24px rgba(184,40,40,.22), inset 0 1px 0 rgba(184,40,40,.15);
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    .brand-name {
      font-family: var(--display);
      font-size: 26px;
      letter-spacing: .18em;
      color: #f0f4f0;
      text-shadow: 0 0 40px rgba(200,30,30,.25);
    }
    .brand-sub {
      font-family: var(--body);
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-top: 4px;
    }

    /* card */
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--parchment-2);
      border: 1px solid var(--rule);
      border-radius: 10px;
      box-shadow: 0 2px 0 rgba(184,40,40,.04), 0 32px 64px -16px rgba(0,0,0,.88);
      overflow: hidden;
    }

    /* tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--rule);
    }
    .tab {
      padding: 14px;
      text-align: center;
      font-family: var(--display);
      font-size: 13px;
      letter-spacing: .14em;
      color: var(--ink-faint);
      cursor: pointer;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--ink-dim); }
    .tab.active {
      color: var(--gold-bright);
      border-bottom-color: var(--gold);
    }

    /* form */
    .form-body { padding: 28px; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: var(--body);
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: var(--gold); }
    .field input::placeholder { color: var(--ink-faint); }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7a1818, #b82828);
      border: none;
      border-radius: 6px;
      font-family: var(--display);
      font-size: 14px;
      letter-spacing: .14em;
      color: #f0e8e0;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    /* messages */
    .msg {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .msg.show { display: block; }
    .msg.error { background: rgba(204,42,58,.15); border: 1px solid rgba(204,42,58,.4); color: #ff8888; }
    .msg.success { background: rgba(122,154,82,.15); border: 1px solid rgba(122,154,82,.4); color: #a8d878; }

    .divider {
      text-align: center;
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--ink-faint);
      margin: 16px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: var(--rule);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 20px;
      letter-spacing: .05em;
    }

    .grain-overlay {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .2; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
  </style>
</head>
<body>
  <div class="grain-overlay"></div>
  <div class="page">
    <a href="/" style="
      position:fixed; top:20px; left:24px;
      display:inline-flex; align-items:center; gap:7px;
      font-family:var(--display); font-size:12px; letter-spacing:.14em;
      color:var(--ink-faint); text-decoration:none;
      padding:7px 14px; border:1px solid var(--rule); border-radius:6px;
      background:rgba(20,17,11,.6); backdrop-filter:blur(8px);
      transition:color .15s, border-color .15s;
    " onmouseover="this.style.color='var(--gold)';this.style.borderColor='rgba(184,40,40,.40)'"
       onmouseout="this.style.color='var(--ink-faint)';this.style.borderColor='var(--rule)'">
      ← Back
    </a>

    <div class="brand">
      <div class="brand-mark">📖</div>
      <div class="brand-name">Abraxas Codex</div>
      <div class="brand-sub">Hidn Studios · World Builder</div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <div class="form-body">
        <div class="msg" id="msg"></div>

        <!-- Sign In -->
        <div id="panel-signin">
          <div class="field">
            <label>Email</label>
            <input type="email" id="si-email" placeholder="your@email.com" autocomplete="email"/>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password"/>
          </div>
          <button class="btn-primary" id="si-btn" onclick="signIn()">Enter the Codex</button>
        </div>

        <!-- Sign Up -->
        <div id="panel-signup" style="display:none">
          <div class="field">
            <label>Full Name</label>
            <input type="text" id="su-name" placeholder="Your name"/>
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="su-email" placeholder="your@email.com" autocomplete="email"/>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="su-password" placeholder="Min. 6 characters" autocomplete="new-password"/>
          </div>
          <button class="btn-primary" id="su-btn" onclick="signUp()">Create Account</button>
        </div>
      </div>
    </div>

    <div class="footer-note">Abraxascodex.com &nbsp;·&nbsp; Hidn Studios</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>
    // Capture invite code from URL and persist it across the login redirect
    const _inviteParam = new URLSearchParams(window.location.search).get('invite');
    if (_inviteParam) sessionStorage.setItem('pendingInvite', _inviteParam);

    // Redirect to studio if already signed in (invite will be picked up there)
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = '/Mythic%20Spellbook%20Studio.html';
    });

    let currentTab = 'signin';

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('panel-signin').style.display = tab === 'signin' ? '' : 'none';
      document.getElementById('panel-signup').style.display = tab === 'signup' ? '' : 'none';
      document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      clearMsg();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg show ' + type;
    }
    function clearMsg() {
      const el = document.getElementById('msg');
      el.className = 'msg';
    }

    function setBusy(id, busy) {
      const btn = document.getElementById(id);
      btn.disabled = busy;
      btn.textContent = busy ? 'Please wait…' : (id === 'si-btn' ? 'Enter the Codex' : 'Create Account');
    }

    async function signIn() {
      const email = document.getElementById('si-email').value.trim();
      const password = document.getElementById('si-password').value;
      if (!email || !password) return showMsg('Enter your email and password.', 'error');
      setBusy('si-btn', true); clearMsg();
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { showMsg(error.message, 'error'); setBusy('si-btn', false); return; }
      window.location.href = '/Mythic%20Spellbook%20Studio.html';
    }

    async function signUp() {
      const name = document.getElementById('su-name').value.trim();
      const email = document.getElementById('su-email').value.trim();
      const password = document.getElementById('su-password').value;
      if (!name || !email || !password) return showMsg('All fields are required.', 'error');
      if (password.length < 6) return showMsg('Password must be at least 6 characters.', 'error');
      setBusy('su-btn', true); clearMsg();
      const { error } = await supabaseClient.auth.signUp({
        email, password,
        options: { data: { full_name: name } }
      });
      if (error) { showMsg(error.message, 'error'); setBusy('su-btn', false); return; }
      showMsg('Account created! Check your email to confirm, then sign in.', 'success');
      setBusy('su-btn', false);
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (currentTab === 'signin') signIn();
        else signUp();
      }
    });
  </script>
</body>
</html>
